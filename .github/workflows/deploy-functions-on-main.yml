name: Deploy Firebase production on main

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: firebase-production
      cancel-in-progress: false
    env:
      VITE_APPCHECK_SITE_KEY: ${{ secrets.VITE_APPCHECK_SITE_KEY }}
      VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
      VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
      VITE_APP_BASE_URL: https://mybodyscanapp.com
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 21 for Firebase emulators
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install web deps
        run: npm ci --no-audit --no-fund

      - name: Audit production web dependencies
        run: npx --yes npm@11 audit --omit=dev --audit-level=high

      - name: Verify production public configuration
        run: npm run check:production-config

      - name: Verify web and native release configuration
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build:prod
          npm run check:ios-release-config
          npm run check:ios-release-guard
          npm run check:android-release-config
          node scripts/check-native-release-guard.mjs
          node scripts/assert-no-native-firebase-auth.mjs
          npm run rules:check
          node scripts/verify-dist-assets.js

      - name: Install Firestore rules test dependencies
        run: npm ci --prefix tests/rules --no-audit --no-fund

      - name: Verify Firestore rules in emulator
        run: npx firebase emulators:exec --only firestore --project demo-mbs "npm run test:rules"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions deps
        working-directory: functions
        run: npm ci --no-audit --no-fund

      - name: Typecheck functions
        run: npm run typecheck:functions

      - name: Audit production Functions dependencies
        working-directory: functions
        run: npx --yes npm@11 audit --omit=dev --audit-level=high

      - name: Build and test functions
        working-directory: functions
        run: npm test

      - name: Verify scan, credit, refund, and account deletion pipeline
        run: npm run verify:scan

      # Keep production ADC out of unit tests and emulators. Deployment tools
      # authenticate below only after all local-style verification has passed.
      - id: google-auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: mybodyscan-f3daf
          workload_identity_provider: projects/157018993008/locations/global/workloadIdentityPools/github-actions/providers/mybodyscan
          service_account: github-mybodyscan-deploy@mybodyscan-f3daf.iam.gserviceaccount.com

      - name: Deploy production in dependency order
        run: |
          rollback_channel="rollback-${GITHUB_SHA:0:7}"
          fallback_rollback_channel="rollback-c1c1d6b"
          if ! npx firebase hosting:clone mybodyscan-f3daf:live "mybodyscan-f3daf:${rollback_channel}" --project mybodyscan-f3daf; then
            echo "::warning::Firebase Hosting preview-channel capacity prevented a commit-specific rollback snapshot; reusing the recorded rollback slot."
            rollback_channel="${fallback_rollback_channel}"
            npx firebase hosting:clone mybodyscan-f3daf:live "mybodyscan-f3daf:${rollback_channel}" --project mybodyscan-f3daf
          fi
          echo "Hosting rollback channel: ${rollback_channel}" >> "${GITHUB_STEP_SUMMARY}"
          npm run storage:cors:apply
          npx firebase deploy --only firestore:indexes --project mybodyscan-f3daf --non-interactive
          npx firebase deploy --only functions --project mybodyscan-f3daf --non-interactive
          npx firebase deploy --only firestore:rules,storage --project mybodyscan-f3daf --non-interactive
          npx firebase deploy --only hosting --project mybodyscan-f3daf --non-interactive
