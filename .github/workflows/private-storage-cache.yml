name: Private photo cache maintenance
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply cache metadata changes (false performs a read-only dry run)"
        type: boolean
        default: false
      max_objects:
        description: "Maximum objects to inspect (1-10000)"
        default: "1000"
permissions:
  contents: read
  id-token: write
jobs:
  cache-metadata:
    runs-on: ubuntu-latest
    environment: production
    concurrency: private-photo-cache-maintenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: google-github-actions/auth@v3
        with:
          project_id: mybodyscan-f3daf
          workload_identity_provider: projects/157018993008/locations/global/workloadIdentityPools/github-actions/providers/mybodyscan
          service_account: github-mybodyscan-deploy@mybodyscan-f3daf.iam.gserviceaccount.com
      - name: Inspect or update private cache metadata
        env:
          APPLY: ${{ inputs.apply }}
          PRIVATE_CACHE_MAX_OBJECTS: ${{ inputs.max_objects }}
        run: |
          if [ "$APPLY" = true ]; then
            node scripts/private-storage-cache.mjs --apply
          else
            node scripts/private-storage-cache.mjs
          fi
